<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS — Oficina</title>
<link rel="stylesheet" href="style.css?v=59">
<style>
  body { margin: 0; }
  .vest { min-height: 100dvh; display: flex; flex-direction: column; background:
    radial-gradient(120% 70% at 50% 0%, #15243a 0%, #0a1018 60%, #070b11 100%); }
  .vest-topo { padding: 18px 20px 6px; text-align: center; }
  .vest-topo h1 { margin: 0; font-size: 15px; letter-spacing: .32em; color: #8fa6c4; font-weight: 700; }
  .palco { flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; touch-action: none; cursor: grab; min-height: 300px; }
  .palco:active { cursor: grabbing; }
  .palco::after { content: ''; position: absolute; left: 50%; bottom: 14%;
    width: 220px; height: 54px; transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(34,227,255,.18), transparent 70%); }
  #palcoCanvas { position: relative; z-index: 1; }
  .dica { text-align: center; font-size: 11px; color: #5c7190; }
  .vest-baixo { padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); }
  .grupo { margin-bottom: 14px; }
  .grupo h2 { margin: 0 0 7px; font-size: 11px; letter-spacing: .18em; color: #6d84a3; font-weight: 700; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; }
  .op { border: 1px solid #22304a; background: #101a28; color: #c3d2e6;
    padding: 8px 13px; border-radius: 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .op[aria-pressed="true"] { border-color: #22e3ff; color: #eaf6ff; box-shadow: inset 0 0 0 1px #22e3ff44; }
  .bola { width: 34px; height: 34px; padding: 0; border-radius: 50%; }
  .abas { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px;
    scrollbar-width: none;
    mask-image: linear-gradient(to right, #000 86%, transparent 100%); }
  .abas::-webkit-scrollbar { display: none; }
  .op.aba { white-space: nowrap; padding: 7px 12px; font-size: 12px; }
  #prateleira h2 { margin: 2px 0 7px; font-size: 11px; letter-spacing: .18em;
    color: #6d84a3; font-weight: 700; }
  #prateleira .fila { margin-bottom: 12px; }
  .op b { display: block; font-weight: 600; }
  .op i { display: block; font-style: normal; font-size: 11px; color: #ffcb57; margin-top: 2px; }
  .op.travado { opacity: .72; }
  .acoes { display: flex; gap: 8px; }
  .acoes .op { flex: 1; text-align: center; }
</style>
</head>
<body>
<div class="vest">
  <div class="vest-topo"><h1>OFICINA</h1></div>
  <div class="palco" id="palco"><canvas id="palcoCanvas"></canvas></div>
  <p class="dica" id="dica">Arraste para girar</p>
  <div class="vest-baixo">
    <div id="abas" class="abas"></div>
    <div id="prateleira"></div>
    <div class="acoes">
      <button class="op" id="btAndar" aria-pressed="true">Andando</button>
      <button class="op" id="btVoltar">Voltar ao jogo</button>
    </div>
  </div>
</div>

<script type="module">
import { criarBoneco } from './boneco3d.js?v=59';
import { NEONS } from './player.js?v=59';
import {
  SLOTS, CATALOGO, PLACAS, CORES_PECA,
  VISUAL_PADRAO, resolverVisual, mudouDePeca, precoDaPeca,
} from './visual.js?v=59';

const PALETAS = { peca: CORES_PECA };
const CHAVE = 'atlas.oficina.v1';

let visual = { ...VISUAL_PADRAO };
try {
  const salvo = JSON.parse(localStorage.getItem(CHAVE));
  if (salvo) visual = { ...visual, ...salvo };
} catch { /* sem armazenamento */ }

let neon = (NEONS.find((n) => n.id === visual.neonId) || NEONS[0]);
let aba = SLOTS[0].id;
const estado = { andando: true, angulo: 0 };

const $ = (id) => document.getElementById(id);
const palco = $('palco');
const canvas = $('palcoCanvas');
let boneco = null;

const resolvido = () => resolverVisual(visual, neon.cor);

function guardar() {
  try { localStorage.setItem(CHAVE, JSON.stringify({ ...visual, neonId: neon.id })); } catch { /* ok */ }
}

// Peca muda a geometria, cor nao: so remonta quando precisa mesmo.
function aplicar(antes) {
  if (!boneco) return;
  if (mudouDePeca(antes, visual)) boneco.vestir(resolvido());
  else boneco.pintar(resolvido());
  guardar();
}

function trocar(mudanca) {
  const antes = { ...visual };
  visual = { ...visual, ...mudanca };
  aplicar(antes);
  desenhar();
}

function botao({ rotulo, cor, ativo, preco, aoClicar }) {
  const b = document.createElement('button');
  b.className = 'op' + (cor ? ' bola' : '') + (preco ? ' travado' : '');
  if (cor) { b.style.background = cor; b.setAttribute('aria-label', rotulo); b.title = rotulo; }
  else b.innerHTML = `<b>${rotulo}</b>${preco ? `<i>${preco} ouro</i>` : ''}`;
  b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
  b.onclick = aoClicar;
  return b;
}

// Metal e Neon primeiro: são os dois que mudam a unidade inteira de uma vez, e
// a fila rola para o lado — o que fica no fim ninguém acha.
const abasDaTela = () => [
  ['placa', 'Metal'], ['neon', 'Neon'], ...SLOTS.map((s) => [s.id, s.nome]),
];

function desenhar() {
  const abas = $('abas');
  abas.textContent = '';
  for (const [id, nome] of abasDaTela()) {
    const b = botao({
      rotulo: nome, ativo: aba === id,
      aoClicar: () => { aba = id; desenhar(); },
    });
    b.classList.add('aba');
    abas.appendChild(b);
  }

  const p = $('prateleira');
  p.textContent = '';

  if (aba === 'neon') {
    const fila = document.createElement('div');
    fila.className = 'fila';
    for (const n of NEONS) {
      fila.appendChild(botao({
        rotulo: n.nome, cor: n.cor, ativo: neon.id === n.id,
        aoClicar: () => { neon = n; if (boneco) boneco.vestir(resolvido()); guardar(); desenhar(); },
      }));
    }
    p.appendChild(titulo('COR DO NEON'));
    p.appendChild(fila);
    return;
  }

  if (aba === 'placa') {
    const fila = document.createElement('div');
    fila.className = 'fila';
    for (const t of PLACAS) {
      fila.appendChild(botao({
        rotulo: t.nome, cor: t.cor, ativo: visual.placa === t.id,
        aoClicar: () => trocar({ placa: t.id }),
      }));
    }
    p.appendChild(titulo('METAL DO CHASSI'));
    p.appendChild(fila);
    return;
  }

  const slot = SLOTS.find((s) => s.id === aba);
  const fila = document.createElement('div');
  fila.className = 'fila';
  for (const item of CATALOGO[slot.id]) {
    const preco = precoDaPeca(slot.id, item.id);
    fila.appendChild(botao({
      rotulo: item.nome, ativo: visual[slot.id] === item.id, preco,
      aoClicar: () => trocar({ [slot.id]: item.id }),
    }));
  }
  p.appendChild(titulo('MODELO'));
  p.appendChild(fila);

  if (slot.cores) {
    const chave = `${slot.id}Cor`;
    const filaC = document.createElement('div');
    filaC.className = 'fila';
    for (const c of PALETAS[slot.cores]) {
      filaC.appendChild(botao({
        rotulo: c.nome, cor: c.cor || neon.cor, ativo: visual[chave] === c.id,
        aoClicar: () => trocar({ [chave]: c.id }),
      }));
    }
    p.appendChild(titulo('COR'));
    p.appendChild(filaC);
  }
}

function titulo(t) {
  const h = document.createElement('h2');
  h.textContent = t;
  return h;
}

function medir() {
  const larg = Math.min(palco.clientWidth - 24, 340);
  const alt = Math.min(Math.max(palco.clientHeight - 12, 240), 420);
  canvas.style.width = larg + 'px';
  canvas.style.height = alt + 'px';
  if (boneco) boneco.dimensionar(larg, alt);
}

// Arrastar para girar: um dedo na tela ou o mouse, sem biblioteca.
let arrastando = false; let xAnterior = 0;
palco.addEventListener('pointerdown', (e) => { arrastando = true; xAnterior = e.clientX; });
window.addEventListener('pointermove', (e) => {
  if (!arrastando) return;
  estado.angulo += (e.clientX - xAnterior) * 0.012;
  xAnterior = e.clientX;
});
window.addEventListener('pointerup', () => { arrastando = false; });
palco.addEventListener('pointercancel', () => { arrastando = false; });

$('btAndar').onclick = () => {
  estado.andando = !estado.andando;
  $('btAndar').textContent = estado.andando ? 'Andando' : 'Parado';
  $('btAndar').setAttribute('aria-pressed', estado.andando ? 'true' : 'false');
};
$('btVoltar').onclick = () => { location.href = './'; };

desenhar();

try {
  boneco = await criarBoneco(canvas, resolvido());
  medir();
  window.addEventListener('resize', medir);
  const laco = () => {
    boneco.quadro(estado.andando, 0, estado.angulo);
    requestAnimationFrame(laco);
  };
  laco();
  window.__boneco = boneco; // para conferencia
  window.__vestir = (m) => trocar(m);
} catch (e) {
  $('dica').textContent = 'O 3D nao abriu neste aparelho: ' + e.message;
}
</script>
</body>
</html>
